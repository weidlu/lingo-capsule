<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LingoCapsule Expanded Suggestion Popover</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#c3c8c5",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-background": "#1a1c1c",
                        "tertiary-fixed-dim": "#66d9cc",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#576661",
                        "inverse-primary": "#bec9c4",
                        "on-primary-container": "#818c87",
                        "tertiary-container": "#002723",
                        "surface-tint": "#56615d",
                        "secondary-container": "#d3e3dd",
                        "on-primary": "#ffffff",
                        "on-surface": "#1a1c1c",
                        "on-tertiary-fixed-variant": "#005049",
                        "on-primary-fixed-variant": "#3e4945",
                        "on-secondary-fixed": "#101e1a",
                        "tertiary-fixed": "#84f5e8",
                        "inverse-on-surface": "#f1f1f1",
                        "on-primary-fixed": "#141e1b",
                        "on-surface-variant": "#434846",
                        "on-tertiary-container": "#079a8e",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#bacac4",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "tertiary": "#000e0c",
                        "background": "#f9f9f9",
                        "primary-fixed-dim": "#bec9c4",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f3f3f3",
                        "on-secondary-fixed-variant": "#3b4a45",
                        "on-tertiary-fixed": "#00201d",
                        "surface-dim": "#dadada",
                        "primary-fixed": "#dae5e0",
                        "secondary-fixed": "#d6e6e0",
                        "surface-bright": "#f9f9f9",
                        "outline": "#737876",
                        "surface-container": "#eeeeee",
                        "surface": "#f9f9f9",
                        "secondary": "#53625d",
                        "primary": "#050d0b",
                        "surface-container-high": "#e8e8e8",
                        "surface-variant": "#e2e2e2",
                        "surface-container-highest": "#e2e2e2",
                        "primary-container": "#1a2421",
                        "inverse-surface": "#2f3131"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "capsule-height": "44px",
                        "popover-width": "360px",
                        "unit": "4px",
                        "padding-loose": "16px",
                        "gutter": "12px",
                        "capsule-width-range": "180px-240px",
                        "padding-standard": "12px",
                        "padding-tight": "8px"
                    },
                    "fontFamily": {
                        "body-main": ["Inter"],
                        "hint-text": ["Inter"],
                        "capsule-text": ["Inter"],
                        "popover-heading": ["Manrope"],
                        "label-compact": ["Inter"]
                    },
                    "fontSize": {
                        "body-main": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "hint-text": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "capsule-text": ["13px", {"lineHeight": "16px", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                        "popover-heading": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "label-compact": ["11px", {"lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-main text-on-surface">
<!-- macOS Style Desktop Background Context -->
<div class="absolute inset-0 z-0">
<img alt="macOS style background" class="w-full h-full object-cover opacity-80 filter blur-sm" data-alt="A serene, abstract macOS-style desktop wallpaper featuring smooth, flowing gradient waves in soft pastel tones of light grey, pale teal, and muted white. The lighting is diffused and ethereal, creating a calm, minimalist aesthetic typical of modern operating systems. The overall mood is clean, professional, and sophisticated, perfectly complementing a light-mode glassmorphism interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8QLM29NYSM8Y3J26DaSd5YAs5yu4SAK2DobY-rXqIToMAuhaQoNjje-bMaoXO60g2ezT07-inQ4C_ffGzaU41jDtqe3BV4QPR0_4WBPeLy9seNd3Z5bgH-qgYgwsNpiG1H5BwMfQF30rHw4wFAKBRGP1bqQsibC-8BqRUtQCynOjHLHtV3QnWAuYMmKPZqo6UwUjnR-Cd77Kd6DoDq9YGvraJ_us-v3keyAOT9afvJ-LLAOohWfBJJCVbwx7irDJqI3wb9uiWRVPn"/>
</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[800px] h-[600px] flex items-end justify-center pb-24">
<!-- Input Field Area (Anchor point) -->
<div class="w-full max-w-[600px] relative">
<!-- Tether Popover (Anchored above input) -->
<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-[8px] w-[300px] bg-white/70 backdrop-blur-[30px] border border-white/40 rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.1)] flex flex-col overflow-hidden">
<!-- Popover Header -->
<div class="flex items-center justify-between px-padding-standard py-padding-tight border-b border-white/20">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-amber-400"></div>
<span class="font-popover-heading text-popover-heading text-on-surface">2 Tips</span>
<span class="font-label-compact text-label-compact text-on-surface-variant bg-surface-variant/50 px-1.5 py-0.5 rounded ml-1">Chrome</span>
</div>
<button class="text-on-surface-variant hover:text-on-surface hover:bg-white/20 rounded p-0.5 transition-colors">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Diagnosis -->
<div class="px-padding-standard pt-padding-standard pb-unit">
<p class="font-body-main text-body-main text-on-surface">意思清楚，但有两处不自然。</p>
</div>
<!-- Issue Rows -->
<div class="px-padding-standard py-unit flex flex-col gap-2">
<!-- Issue 1 -->
<div class="border-l-[3px] border-amber-300 pl-2 py-1">
<div class="flex items-center gap-2 mb-1 flex-wrap"><span class="font-hint-text text-hint-text text-on-surface-variant bg-amber-100/50 px-1.5 py-0.5 rounded">I am agree</span><span class="material-symbols-outlined text-[14px] text-on-surface-variant">arrow_right_alt</span><button class="bg-[#26A69A]/10 text-[#005049] font-hint-text text-hint-text px-2 py-0.5 rounded font-medium hover:bg-[#26A69A]/20 transition-colors">I agree</button></div>
<p class="font-hint-text text-hint-text text-on-surface-variant">agree 本身是动词，不需要 am。</p>
</div>
<!-- Issue 2 -->
<div class="border-l-[3px] border-amber-300 pl-2 py-1">
<div class="flex items-center gap-2 mb-1 flex-wrap"><span class="font-hint-text text-hint-text text-on-surface-variant bg-amber-100/50 px-1.5 py-0.5 rounded">discuss about</span><span class="material-symbols-outlined text-[14px] text-on-surface-variant">arrow_right_alt</span><button class="bg-[#26A69A]/10 text-[#005049] font-hint-text text-hint-text px-2 py-0.5 rounded font-medium hover:bg-[#26A69A]/20 transition-colors">discuss</button></div>
<p class="font-hint-text text-hint-text text-on-surface-variant">discuss 通常直接接对象。</p>
</div>
</div>
<!-- Rewrite Options -->
<div class="px-padding-standard py-unit flex flex-col gap-1 border-t border-white/20 mt-1 pt-2 gap-2">
<!-- Option 1 -->
<button class="w-full text-left px-2 py-1.5 rounded-lg hover:bg-white/30 transition-colors flex items-start gap-4 group">
<span class="font-label-compact text-label-compact text-on-surface-variant w-16 shrink-0 mt-0.5 uppercase tracking-wider">Casual</span>
<span class="font-body-main text-body-main text-on-surface group-hover:text-primary transition-colors flex-1">I agree we should discuss this later.</span>
</button>
<!-- Option 2 -->
<button class="w-full text-left px-2 py-1.5 rounded-lg hover:bg-white/30 transition-colors flex items-start gap-4 group">
<span class="font-label-compact text-label-compact text-on-surface-variant w-16 shrink-0 mt-0.5 uppercase tracking-wider">Professional</span>
<span class="font-body-main text-body-main text-on-surface group-hover:text-primary transition-colors flex-1">I agree that we should discuss this later.</span>
</button>
</div>
<!-- Footer -->
<div class="px-padding-standard py-padding-tight bg-white/40 border-t border-white/20 flex items-center justify-between mt-2">
<button class="font-hint-text text-hint-text text-on-surface-variant hover:text-on-surface transition-colors underline decoration-dotted underline-offset-2">Ignore</button>
<div class="flex items-center gap-2">
<button class="text-on-surface-variant hover:text-on-surface p-1 rounded hover:bg-white/40 transition-colors">
<span class="material-symbols-outlined text-[18px]">content_copy</span>
</button>
<button class="bg-primary text-on-primary font-capsule-text text-capsule-text px-3 py-1 rounded-md hover:bg-primary/90 active:scale-95 transition-all">
                            Apply
                        </button>
</div>
</div>
</div>
<!-- Input Field (Mock) -->
<div class="w-full bg-white/60 backdrop-blur-md border border-white/50 rounded-xl px-4 py-3 shadow-sm flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">edit_note</span>
<div class="flex-1 font-body-main text-body-main text-on-surface">
<span class="text-on-surface">I am agree we should discuss about this later.</span>
<span class="w-px h-4 bg-primary inline-block align-middle ml-1 animate-pulse"></span>
</div>
</div>
</div>
</main>
</body></html>
